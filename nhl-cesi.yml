name: NHL cesi hraci

on:
  schedule:
    - cron: '7,37 3-9 * * *'
    - cron: '41 10-14 * * *'
  workflow_dispatch:
    inputs:
      datum:
        description: 'Datum RRRR-MM-DD (nepovinne)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: nhl-cesi
  cancel-in-progress: false

jobs:
  prehled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python nhl_cesi.py ${{ inputs.datum }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Ulozit stav
        run: |
          git config user.name "nhl-bot"
          git config user.email "nhl-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "stav"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
