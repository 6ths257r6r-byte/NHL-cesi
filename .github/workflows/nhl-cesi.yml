name: NHL cesi hraci

on:
  schedule:
    - cron: '*/30 3-8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prehled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python nhl_cesi.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Ulozit stav
        run: |
          git config user.name "nhl-bot"
          git config user.email "nhl-bot@users.noreply.github.com"
          git add odeslano.txt || true
          git diff --cached --quiet || (git commit -m "stav" && git push)
